
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Car Racing Game V2</title>
<link rel="stylesheet" href="codewithpavaniq.css">
</head>
<body>
<div id="hud">
  <div class="panel">
    SPEED<br>
    <span id="speed">0</span> KM/H
    <br>
    <div>NITRO</div>
    <div id="nitroBar">
      <div id="nitroFill"></div>
    </div>
  </div>

  <div class="panel" style="text-align:right">
    SCORE: <span id="score">0</span><br>
    COINS: <span id="coins">0</span><br>
    BEST: <span id="best">0</span>
  </div>
</div>

<div id="message">NITRO BOOST!</div>

<div id="controls">
  <div class="controlGroup">
    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>
  </div>

  <div class="controlGroup">
    <button class="control" id="brakeBtn">BRAKE</button>
    <button class="control" id="nitroBtn">NITRO ⚡</button>
  </div>
</div>

<div id="overlay">
  <div class="menu">
    <h1>🏎️ STREET RACER</h1>
    <h3>VERSION 2.0</h3>
    <p>
      Dodge traffic, collect coins and activate
      nitro to reach maximum speed!
      <br><br>
      Avoid crashing into other cars.
    </p>
    <button id="startBtn">START RACE 🚀</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* -----------------------------
   GAME SETUP
----------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 35, 150);

const camera = new THREE.PerspectiveCamera(
  65,
  innerWidth / innerHeight,
  0.1,
  500
);

camera.position.set(0, 6, 11);
camera.lookAt(0, 1, -5);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(
  Math.min(devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* -----------------------------
   LIGHTING
----------------------------- */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x557744,
    2
  )
);

const sunlight = new THREE.DirectionalLight(
  0xffffff,
  2
);

sunlight.position.set(-10, 20, 10);
sunlight.castShadow = true;
scene.add(sunlight);

/* -----------------------------
   MATERIALS
----------------------------- */

function material(color, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color,
    metalness,
    roughness: 0.55
  });
}

const roadMat = material(0x333333);
const grassMat = material(0x78c83f);
const whiteMat = material(0xffffff);
const blackMat = material(0x111111);
const glassMat = material(0x243c50, 0.3);

/* -----------------------------
   WORLD
----------------------------- */

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 400),
  grassMat
);

ground.rotation.x = -Math.PI / 2;
ground.position.z = -100;
ground.receiveShadow = true;
scene.add(ground);

// Road
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 400),
  roadMat
);

road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;
road.position.z = -100;
scene.add(road);

// Road boundaries
[-5.7, 5.7].forEach(x => {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.04, 400),
    whiteMat
  );

  line.position.set(x, 0.06, -100);
  scene.add(line);
});

// Lane markings
const laneLines = [];

for (let z = -200; z < 20; z += 12) {
  for (let x of [-2, 2]) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.04, 5),
      whiteMat
    );

    line.position.set(x, 0.07, z);
    scene.add(line);
    laneLines.push(line);
  }
}

/* -----------------------------
   BUILDINGS
----------------------------- */

const buildings = [];

function createBuilding(x, z) {
  const height = 5 + Math.random() * 14;
  const width = 3 + Math.random() * 5;

  const colors = [
    0x778899,
    0x9b9b9b,
    0x52677a,
    0x657b8b,
    0x777777
  ];

  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, 5),
    material(colors[
      Math.floor(Math.random() * colors.length)
    ])
  );

  building.position.set(x, height / 2, z);
  building.castShadow = true;
  scene.add(building);

  buildings.push(building);
}

for (let z = -180; z < 10; z += 13) {
  createBuilding(-12 - Math.random() * 5, z);
  createBuilding(12 + Math.random() * 5, z - 6);
}

/* -----------------------------
   CAR CREATION
----------------------------- */

function createCar(color) {
  const car = new THREE.Group();

  // Main body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.1, 0.65, 4),
    material(color, 0.35)
  );

  body.position.y = 0.85;
  body.castShadow = true;
  car.add(body);

  // Hood
  const hood = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.18, 1.2),
    material(color)
  );

  hood.position.set(0, 1.12, -1.3);
  car.add(hood);

  // Roof
  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(1.65, 0.8, 1.8),
    glassMat
  );

  roof.position.set(0, 1.55, 0.2);
  roof.castShadow = true;
  car.add(roof);

  // Front windshield
  const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.65, 0.08),
    material(0x172c40)
  );

  windshield.position.set(0, 1.55, -0.72);
  car.add(windshield);

  // Rear windshield
  const rearGlass = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.65, 0.08),
    glassMat
  );

  rearGlass.position.set(0, 1.55, 1.1);
  car.add(rearGlass);

  // Bumpers
  [-1, 1].forEach(side => {
    const bumper = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.25, 0.2),
      blackMat
    );

    bumper.position.set(side * 1.05, 0.65, -2);
    car.add(bumper);
  });

  // Wheels
  const wheels = [];

  for (let x of [-1.08, 1.08]) {
    for (let z of [-1.25, 1.25]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.48, 0.48, 0.28, 20
        ),
        blackMat
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(x, 0.55, z);
      wheel.castShadow = true;
      car.add(wheel);
      wheels.push(wheel);
    }
  }

  // Headlights
  for (let x of [-0.7, 0.7]) {
    const light = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.2, 0.08),
      material(0xffffaa, 0.1)
    );

    light.position.set(x, 0.95, -2.02);
    car.add(light);
  }

  car.userData.wheels = wheels;

  return car;
}

// Player car
const player = createCar(0xff1700);
player.position.set(0, 0, 3);
scene.add(player);

/* -----------------------------
   TRAFFIC
----------------------------- */

const enemies = [];

const enemyColors = [
  0x0066ff,
  0xffcc00,
  0xffffff,
  0x9900ff,
  0x00cc88
];

function spawnEnemy() {
  const lanes = [-4, 0, 4];

  const enemy = createCar(
    enemyColors[
      Math.floor(Math.random() * enemyColors.length)
    ]
  );

  enemy.position.set(
    lanes[Math.floor(Math.random() * lanes.length)],
    0,
    -100 - Math.random() * 50
  );

  enemy.userData.speed = 0.7 + Math.random() * 0.6;

  scene.add(enemy);
  enemies.push(enemy);
}

/* -----------------------------
   COINS
----------------------------- */

const coins = [];

const coinMat = new THREE.MeshStandardMaterial({
  color: 0xffd700,
  metalness: 0.8,
  roughness: 0.2
});

function spawnCoin() {
  const coin = new THREE.Mesh(
    new THREE.TorusGeometry(0.48, 0.15, 10, 20),
    coinMat
  );

  const lanes = [-4, 0, 4];

  coin.position.set(
    lanes[Math.floor(Math.random() * lanes.length)],
    1.5,
    -100 - Math.random() * 40
  );

  coin.userData.collected = false;

  scene.add(coin);
  coins.push(coin);
}

/* -----------------------------
   GAME VARIABLES
----------------------------- */

let running = false;
let speed = 0;
let score = 0;
let coinCount = 0;
let nitro = 100;
let distance = 0;

let steering = 0;
let nitroActive = false;
let braking = false;

let enemyTimer = 0;
let coinTimer = 0;

let best = Number(
  localStorage.getItem("carBest") || 0
);

document.getElementById("best").textContent = best;

/* -----------------------------
   INPUT CONTROLS
----------------------------- */

function bindHold(id, callback) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    callback(true);
  });

  button.addEventListener("pointerup", () => {
    callback(false);
  });

  button.addEventListener("pointerleave", () => {
    callback(false);
  });

  button.addEventListener("pointercancel", () => {
    callback(false);
  });
}

bindHold("left", v => steering = v ? -1 : 0);
bindHold("right", v => steering = v ? 1 : 0);
bindHold("nitroBtn", v => nitroActive = v);
bindHold("brakeBtn", v => braking = v);

// Keyboard controls
const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

/* -----------------------------
   GAME OVER
----------------------------- */

function gameOver() {
  if (!running) return;

  running = false;

  if (score > best) {
    best = score;
    localStorage.setItem("carBest", best);
  }

  document.querySelector(".menu h1").textContent =
    "💥 GAME OVER";

  document.querySelector(".menu h3").textContent =
    "YOUR SCORE: " + score;

  document.querySelector(".menu p").innerHTML =
    "🏆 Coins: " + coinCount +
    "<br>⭐ Best score: " + best +
    "<br><br>Try again and beat your record!";

  document.getElementById("startBtn").textContent =
    "PLAY AGAIN 🚀";

  document.getElementById("overlay").style.display =
    "flex";
}

/* -----------------------------
   START GAME
----------------------------- */

function startGame() {
  score = 0;
  coinCount = 0;
  speed = 0;
  nitro = 100;
  distance = 0;

  steering = 0;
  nitroActive = false;
  braking = false;

  enemyTimer = 0;
  coinTimer = 0;

  player.position.set(0, 0, 3);
  player.rotation.set(0, 0, 0);

  enemies.forEach(e => scene.remove(e));
  coins.forEach(c => scene.remove(c));

  enemies.length = 0;
  coins.length = 0;

  document.getElementById("score").textContent = 0;
  document.getElementById("coins").textContent = 0;
  document.getElementById("speed").textContent = 0;

  document.querySelector(".menu h1").textContent =
    "🏎️ STREET RACER";

  document.querySelector(".menu h3").textContent =
    "VERSION 2.0";

  running = true;

  document.getElementById("overlay").style.display =
    "none";
}

document.getElementById("startBtn").onclick =
  startGame;

/* -----------------------------
   COLLISION DETECTION
----------------------------- */

function collision(a, b, width, depth) {
  return (
    Math.abs(a.position.x - b.position.x) < width &&
    Math.abs(a.position.z - b.position.z) < depth
  );
}

/* -----------------------------
   UI UPDATE
----------------------------- */

function updateUI() {
  document.getElementById("speed").textContent =
    Math.round(speed * 35);

  document.getElementById("score").textContent =
    score;

  document.getElementById("coins").textContent =
    coinCount;

  document.getElementById("nitroFill").style.width =
    nitro + "%";

  document.getElementById("best").textContent =
    best;
}

/* -----------------------------
   ANIMATION LOOP
----------------------------- */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  if (running) {
    updateGame(delta);
  }

  renderer.render(scene, camera);
}

/* -----------------------------
   MAIN GAME LOGIC
----------------------------- */

function updateGame(dt) {

  // Keyboard
  const left = keys["arrowleft"] || keys["a"];
  const right = keys["arrowright"] || keys["d"];
  const boost = keys[" "] || keys["shift"];
  const brake = keys["arrowdown"] || keys["s"];

  const direction =
    (right || steering === 1 ? 1 : 0) -
    (left || steering === -1 ? 1 : 0);

  const boosting = nitroActive || boost;
  const brakingNow = braking || brake;

  // Acceleration
  const targetSpeed = boosting && nitro > 0
    ? 2.8
    : brakingNow
      ? 0.55
      : 1.65;

  speed += (targetSpeed - speed) * dt * 1.5;

  if (boosting && nitro > 0) {
    nitro -= 25 * dt;
    document.getElementById("message").style.display =
      "block";
  } else {
    nitro += 8 * dt;
    document.getElementById("message").style.display =
      "none";
  }

  nitro = THREE.MathUtils.clamp(nitro, 0, 100);

  // Steering
  player.position.x += direction * 10 * dt;

  player.position.x = THREE.MathUtils.clamp(
    player.position.x, -4.6, 4.6
  );

  player.rotation.z = THREE.MathUtils.lerp(
    player.rotation.z,
    -direction * 0.13,
    dt * 8
  );

  player.rotation.y = THREE.MathUtils.lerp(
    player.rotation.y,
    -direction * 0.12,
    dt * 8
  );

  // Wheel rotation
  player.userData.wheels.forEach(wheel => {
    wheel.rotation.x += speed * dt * 5;
  });

  // Camera movement
  camera.position.x += (
    player.position.x * 0.25 - camera.position.x
  ) * dt * 2;

  camera.lookAt(player.position.x * 0.2, 1, -5);

  // Road markings
  laneLines.forEach(line => {
    line.position.z += speed * 22 * dt;

    if (line.position.z > 15) {
      line.position.z -= 216;
    }
  });

  // Buildings
  buildings.forEach(building => {
    building.position.z += speed * 18 * dt;

    if (building.position.z > 20) {
      building.position.z = -180 - Math.random() * 30;
    }
  });

  // Traffic spawning
  enemyTimer += dt;

  if (enemyTimer > Math.max(0.65, 1.7 - speed * 0.3)) {
    spawnEnemy();
    enemyTimer = 0;
  }

  enemies.forEach((enemy, index) => {

    enemy.position.z +=
      (speed * 15 + enemy.userData.speed * 5) * dt;

    enemy.userData.wheels.forEach(wheel => {
      wheel.rotation.x += speed * dt * 4;
    });

    if (collision(player, enemy, 1.65, 2.8)) {
      gameOver();
    }

    if (enemy.position.z > 15) {
      scene.remove(enemy);
      enemies.splice(index, 1);
    }
  });

  // Coin spawning
  coinTimer += dt;

  if (coinTimer > 1.2) {
    spawnCoin();
    coinTimer = 0;
  }

  // Coin collection
  coins.forEach((coin, index) => {

    coin.position.z += speed * 22 * dt;
    coin.rotation.y += dt * 3;
    coin.rotation.x += dt * 1.5;

    if (collision(player, coin, 1.6, 2)) {
      coinCount++;
      score += 100;

      scene.remove(coin);
      coins.splice(index, 1);
    }

    if (coin.position.z > 15) {
      scene.remove(coin);
      coins.splice(index, 1);
    }
  });

  // Distance scoring
  distance += speed * dt * 10;
  score += Math.floor(speed * dt * 2);

  updateUI();
}

/* -----------------------------
   RESIZE
----------------------------- */

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
});

/* -----------------------------
   RUN GAME
----------------------------- */

animate();

</script>
</body>
</html>
